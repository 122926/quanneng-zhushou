<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA">
<title>全能助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230F766E'/%3E%3Cpath d='M7 8.5h10M7 12h6M7 15.5h8' stroke='white' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ============ 基础 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #F7F8FA;
  --panel: #FFFFFF;
  --ink: #1A1D21;
  --ink-2: #5F6770;
  --ink-3: #9AA1A9;
  --line: #E3E6EA;
  --accent: #0F766E;
  --accent-soft: #E8F4F2;
  --danger: #C0392B;
}
html, body { height: 100%; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ============ 整体布局 ============ */
.app {
  height: 100dvh;
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  box-shadow: 0 0 0 1px var(--line);
  position: relative;
  overflow: hidden;
}

/* ============ 顶栏 ============ */
.header {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  z-index: 5;
}
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 auto;
  transition: background .2s;
}
.brand-name { font-size: 16px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
.mode-switch {
  display: flex; background: var(--bg); border-radius: 999px; padding: 3px;
  margin-left: auto;
}
.mode-btn {
  border: 0; background: transparent; border-radius: 999px;
  min-height: 44px; padding: 8px 14px; font-size: 13px; color: var(--ink-2);
  display: flex; align-items: center; gap: 5px;
  transition: background .2s, color .2s;
}
.mode-btn svg { width: 14px; height: 14px; }
.mode-btn.active { background: var(--panel); color: var(--accent); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.icon-btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 10px;
  width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  color: var(--ink-2); flex: 0 0 auto;
}
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn:hover { background: var(--bg); color: var(--ink); }

/* ============ 消息区 ============ */
.main {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 14px 8px;
  scroll-behavior: auto;
}
.msg { display: flex; margin-bottom: 14px; }
.msg.user { justify-content: flex-end; }
.msg .bubble {
  max-width: 82%;
  padding: 10px 13px;
  border-radius: 14px;
  font-size: 15px;
  line-height: 1.65;
  word-break: break-word;
  white-space: pre-wrap;
}
.msg.user .bubble {
  background: var(--accent); color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.ai { justify-content: flex-start; }
.msg.ai .bubble {
  background: var(--bg);
  border: 1px solid var(--line);
  border-bottom-left-radius: 4px;
  white-space: normal;
}
.msg.ai .bubble p { margin: 0 0 8px; }
.msg.ai .bubble p:last-child { margin-bottom: 0; }
.msg.ai .bubble strong { font-weight: 700; }
.msg.ai .bubble ul, .msg.ai .bubble ol { margin: 4px 0 8px; padding-left: 20px; }
.msg.ai .bubble li { margin-bottom: 3px; }
.msg.ai .bubble code {
  font-family: Consolas, "Courier New", monospace;
  background: rgba(0,0,0,.06); border-radius: 4px; padding: 1px 4px;
  font-size: 13px;
}
.msg.ai .bubble pre {
  background: #1F2428; color: #E8ECEF; border-radius: 8px;
  padding: 10px 12px; overflow-x: auto; margin: 8px 0;
  font-size: 13px; line-height: 1.5;
}
.msg.ai .bubble pre code { background: none; color: inherit; padding: 0; }
.msg.ai .bubble h1, .msg.ai .bubble h2, .msg.ai .bubble h3 { font-size: 15px; margin: 10px 0 6px; }
.msg.ai .bubble hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }

/* ============ 欢迎屏 ============ */
.welcome { padding: 18px 4px 4px; }
.welcome h2 { font-size: 20px; margin-bottom: 6px; }
.welcome .sub { color: var(--ink-2); font-size: 14px; margin-bottom: 18px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.card {
  border: 1px solid var(--line); border-radius: 12px; padding: 13px;
  cursor: pointer; text-align: left; background: var(--panel);
  transition: border-color .15s, background .15s;
}
.card:hover { border-color: var(--accent); background: var(--accent-soft); }
.card .card-tag {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 14px; font-weight: 700; margin-bottom: 8px;
  color: var(--accent);
}
.card .card-tag.amber { color: #B45309; }
.card .card-tag svg { width: 13px; height: 13px; }
.card .card-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.card .card-desc { font-size: 14px; color: var(--ink-2); line-height: 1.5; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
  min-height: 44px; padding: 8px 15px; font-size: 13px; color: var(--ink-2);
  transition: border-color .15s, color .15s;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.hint { font-size: 13px; color: var(--ink-3); line-height: 1.6; }

/* ============ 输入区 ============ */
.input-bar {
  flex: 0 0 auto;
  border-top: 1px solid var(--line);
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: var(--panel);
  display: flex;
  align-items: flex-end;
  gap: 8px;
}
.input-box {
  flex: 1 1 auto;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--bg);
  padding: 10px 12px;
  display: flex;
  align-items: flex-end;
  gap: 6px;
  transition: border-color .15s;
}
.input-box:focus-within { border-color: var(--accent); background: var(--panel); }
textarea {
  flex: 1 1 auto; border: 0; background: transparent; resize: none;
  font-family: inherit; font-size: 16px; line-height: 1.5; color: var(--ink);
  max-height: 120px; min-height: 24px;
}
textarea:focus { outline: 0; }
.send-btn {
  border: 0; border-radius: 12px;
  width: 44px; height: 44px; flex: 0 0 auto;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s, opacity .2s;
}
.send-btn svg { width: 18px; height: 18px; }
.send-btn:disabled { opacity: .45; cursor: not-allowed; }

/* ============ 提示条 ============ */
.banner {
  flex: 0 0 auto;
  background: #FDF3F2; color: var(--danger);
  font-size: 13px; line-height: 1.5;
  padding: 8px 14px;
  border-bottom: 1px solid #F3D9D6;
  display: none;
}
.banner.show { display: block; }
.banner .banner-act { color: var(--danger); text-decoration: underline; font-weight: 600; background: none; border: 0; }

/* ============ 打字指示 ============ */
.typing .bubble { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
.typing .dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3);
  animation: blink 1.2s infinite;
}
.typing .dot:nth-child(2) { animation-delay: .2s; }
.typing .dot:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* ============ 弹窗 ============ */
.overlay {
  position: fixed; inset: 0; background: rgba(15,18,20,.45);
  display: none; align-items: flex-end; justify-content: center; z-index: 20;
}
.overlay.show { display: flex; }
.sheet {
  background: var(--panel); width: 100%; max-width: 520px;
  border-radius: 16px 16px 0 0;
  padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height: 78dvh; overflow-y: auto;
}
.sheet h3 { font-size: 16px; margin-bottom: 14px; }
.sheet .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.sheet .row:first-of-type { border-top: 0; }
.sheet .row .k { color: var(--ink-2); }
.sheet .row .v { font-weight: 600; text-align: right; max-width: 60%; }
.sheet .row .v.ok { color: var(--accent); }
.sheet .row .v.bad { color: var(--danger); }
.sheet .desc { font-size: 13.5px; color: var(--ink-2); line-height: 1.6; margin: 10px 0 4px; }
.sheet .danger-btn {
  margin-top: 14px; width: 100%;
  border: 1px solid #F3D9D6; background: #FDF3F2; color: var(--danger);
  border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 600;
}
.sheet .danger-btn:hover { background: #FAE6E3; }

/* ============ 桌面适配 ============ */
@media (min-width: 900px) {
  .app { border-radius: 0; height: 100dvh; }
  .msg .bubble { max-width: 70%; }
}
@media (max-width: 400px) {
  .cards { grid-template-columns: 1fr; }
  .brand-name { font-size: 15px; }
  .mode-btn { padding: 6px 10px; font-size: 13px; min-height: 44px; }
}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="banner" id="banner">
    <span id="bannerText"></span>
    <button class="banner-act" id="bannerAct" type="button"></button>
  </div>

  <header class="header">
    <div class="brand">
      <div class="brand-mark" id="brandMark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M7 8.5h10M7 12h6M7 15.5h8" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <span class="brand-name">全能助手</span>
    </div>
    <div class="mode-switch" role="tablist" aria-label="模式切换">
      <button class="mode-btn active" id="modeWork" type="button" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4 2.5-2.5z"/></svg>
        工作
      </button>
      <button class="mode-btn" id="modeEmotion" type="button" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.6-9.3-9A5.4 5.4 0 0 1 12 6.6 5.4 5.4 0 0 1 21.3 12c-2.3 4.4-9.3 9-9.3 9z"/></svg>
        情感
      </button>
    </div>
    <button class="icon-btn" id="btnSettings" type="button" aria-label="设置" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
    </button>
  </header>

  <main class="main" id="main">
    <section class="welcome" id="welcome">
      <h2>你好，我是全能助手</h2>
      <p class="sub">工作和情感，一个对话搞定。切模式，换人格。</p>
      <div class="cards">
        <div class="card" data-mode="work" role="button" tabindex="0" aria-label="切换到工作模式">
          <span class="card-tag">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4 2.5-2.5z"/></svg>
            工作模式
          </span>
          <div class="card-name">师 · 友 · 秘书</div>
          <div class="card-desc">商业计划书、路演答辩、嵌入式/编程辅导、文档去AI化、纪要周报、任务拆解、职业规划</div>
        </div>
        <div class="card" data-mode="emotion" role="button" tabindex="0" aria-label="切换到情感模式">
          <span class="card-tag amber">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.6-9.3-9A5.4 5.4 0 0 1 12 6.6 5.4 5.4 0 0 1 21.3 12c-2.3 4.4-9.3 9-9.3 9z"/></svg>
            情感模式
          </span>
          <div class="card-name">顾问 · 倾听者 · 教练</div>
          <div class="card-desc">情绪疏导、内耗焦虑、自我认知、恋爱关系、婚姻家庭、人际边界、危机转介</div>
        </div>
      </div>
      <div class="chips" id="chips">
        <button class="chip" type="button">帮我写国创商业计划书大纲</button>
        <button class="chip" type="button">这段代码报错怎么排查</button>
        <button class="chip" type="button">把这段文字去AI化降重</button>
        <button class="chip" type="button">最近很焦虑，内耗严重</button>
        <button class="chip" type="button">帮我分析这段聊天记录</button>
        <button class="chip" type="button">做一份周报模板</button>
      </div>
      <p class="hint">发送即表示使用本机配置的 API 服务。聊天记录只保存在这台浏览器里。</p>
    </section>
    <div id="messages"></div>
  </main>

  <footer class="input-bar">
    <div class="input-box">
      <textarea id="input" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）" aria-label="输入消息"></textarea>
    </div>
    <button class="send-btn" id="send" type="button" aria-label="发送" title="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </footer>

  <div class="overlay" id="overlay">
    <div class="sheet" role="dialog" aria-label="设置">
      <h3>设置</h3>
      <div class="row"><span class="k">后端状态</span><span class="v" id="stReady">检测中…</span></div>
      <div class="row"><span class="k">服务商</span><span class="v" id="stProvider">—</span></div>
      <div class="row"><span class="k">模型</span><span class="v" id="stModel">—</span></div>
      <div class="row"><span class="k">配置位置</span><span class="v" id="stConfig">—</span></div>
      <p class="desc" id="stDesc"></p>
      <button class="danger-btn" id="btnClear" type="button">清空当前会话记录</button>
      <p class="desc" style="margin-top:12px">API Key 填写在电脑上同目录的 <b>config.json</b> 里，改完重启 <b>server.py</b> 生效。</p>
    </div>
  </div>

<!-- ====== JS ====== -->
<script>
(function () {
  "use strict";

  var ACCENTS = { work: "#0F766E", emotion: "#B45309" };
  var SOFT = { work: "#E8F4F2", emotion: "#FAF0E8" };
  var STORAGE_KEY = { work: "qnz_hist_work", emotion: "qnz_hist_emotion" };

  var state = {
    mode: "work",
    busy: false,
    histories: {
      work: loadHist("work"),
      emotion: loadHist("emotion")
    }
  };

  function loadHist(mode) {
    try {
      var raw = localStorage.getItem(STORAGE_KEY[mode]);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.slice(-100) : [];
    } catch (e) { return []; }
  }
  function saveHist(mode) {
    try {
      localStorage.setItem(STORAGE_KEY[mode], JSON.stringify(state.histories[mode].slice(-100)));
    } catch (e) { /* 存储满时静默 */ }
  }

  var el = {
    main: document.getElementById("main"),
    messages: document.getElementById("messages"),
    welcome: document.getElementById("welcome"),
    input: document.getElementById("input"),
    send: document.getElementById("send"),
    banner: document.getElementById("banner"),
    bannerText: document.getElementById("bannerText"),
    bannerAct: document.getElementById("bannerAct"),
    modeWork: document.getElementById("modeWork"),
    modeEmotion: document.getElementById("modeEmotion"),
    brandMark: document.getElementById("brandMark"),
    overlay: document.getElementById("overlay"),
    stReady: document.getElementById("stReady"),
    stProvider: document.getElementById("stProvider"),
    stModel: document.getElementById("stModel"),
    stConfig: document.getElementById("stConfig"),
    stDesc: document.getElementById("stDesc")
  };

  /* ---------- 基础工具 ---------- */
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  // 极简 Markdown：先转义防注入，再还原少量标记
  function md(src) {
    var blocks = [];
    var rest = String(src);
    var re = /```([\s\S]*?)```/g, m;
    while ((m = re.exec(rest)) !== null) {
      blocks.push({ start: m.index, end: re.lastIndex, html: "<pre><code>" + esc(m[1]) + "</code></pre>" });
    }
    var out = "", cursor = 0;
    blocks.forEach(function (b) {
      out += inlineMd(rest.slice(cursor, b.start));
      out += b.html;
      cursor = b.end;
    });
    out += inlineMd(rest.slice(cursor));
    return out;
  }
  function inlineMd(s) {
    var t = esc(s);
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    var paras = t.split(/\n{2,}/);
    var html = paras.map(function (p) {
      var lines = p.split("\n");
      var buf = [];
      var inList = false;
      lines.forEach(function (line) {
        var lm = line.match(/^\s*[-*•]\s+(.*)$/);
        if (lm) {
          if (!inList) { buf.push("<ul>"); inList = true; }
          buf.push("<li>" + lm[1] + "</li>");
        } else {
          if (inList) { buf.push("</ul>"); inList = false; }
          buf.push(line.replace(/\n$/, "") ? line : "<br>");
        }
      });
      if (inList) { buf.push("</ul>"); }
      var body = buf.join("\n");
      if (/^\s*<ul>/.test(body) || /^\s*<pre>/.test(body) || /^\s*<br>/.test(body)) return body;
      return "<p>" + body.replace(/\n/g, "<br>") + "</p>";
    });
    return html.join("");
  }

  /* ---------- 渲染 ---------- */
  function renderAll() {
    el.messages.innerHTML = "";
    state.histories[state.mode].forEach(function (msg) { appendMsgNode(msg.role, msg.content, false); });
    if (!state.histories[state.mode].length) el.welcome.style.display = "";
    else el.welcome.style.display = "none";
    scrollBottom();
  }
  function appendMsgNode(role, content, animate) {
    var wrap = document.createElement("div");
    wrap.className = "msg " + role;
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    if (role === "ai") bubble.innerHTML = md(content);
    else bubble.textContent = content;
    wrap.appendChild(bubble);
    el.messages.appendChild(wrap);
    return wrap;
  }
  function addTyping() {
    var wrap = document.createElement("div");
    wrap.className = "msg ai typing";
    wrap.innerHTML = '<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    el.messages.appendChild(wrap);
    scrollBottom();
    return wrap;
  }
  function scrollBottom() {
    el.main.scrollTop = el.main.scrollHeight;
  }

  /* ---------- 模式切换 ---------- */
  function setMode(mode) {
    if (mode !== "work" && mode !== "emotion") return;
    state.mode = mode;
    document.documentElement.style.setProperty("--accent", ACCENTS[mode]);
    document.documentElement.style.setProperty("--accent-soft", SOFT[mode]);
    el.modeWork.classList.toggle("active", mode === "work");
    el.modeEmotion.classList.toggle("active", mode === "emotion");
    el.modeWork.setAttribute("aria-selected", String(mode === "work"));
    el.modeEmotion.setAttribute("aria-selected", String(mode === "emotion"));
    renderAll();
  }

  /* ---------- 发送 ---------- */
  function send(text) {
    text = String(text || "").trim();
    if (!text || state.busy) return;
    var mode = state.mode;
    state.histories[mode].push({ role: "user", content: text });
    saveHist(mode);
    renderAll();

    state.busy = true;
    el.send.disabled = true;
    var typing = addTyping();
    hideBanner();

    fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: mode, messages: state.histories[mode] })
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, data: data }; });
    }).then(function (r) {
      typing.remove();
      if (r.ok && r.data && r.data.reply) {
        state.histories[mode].push({ role: "ai", content: r.data.reply });
        saveHist(mode);
        renderAll();
      } else {
        var msg = (r.data && r.data.message) || (r.data && r.data.error) || "请求失败";
        showBanner(msg, "打开设置", function () { el.overlay.classList.add("show"); });
      }
    }).catch(function () {
      typing.remove();
      showBanner("连不上后端：请确认 server.py 已在电脑上启动", "打开设置", function () { el.overlay.classList.add("show"); });
    }).finally(function () {
      state.busy = false;
      el.send.disabled = false;
      el.input.focus();
    });
  }

  /* ---------- 提示条 ---------- */
  function showBanner(text, actText, actFn) {
    el.bannerText.textContent = text;
    if (actText && actFn) {
      el.bannerAct.textContent = actText;
      el.bannerAct.onclick = actFn;
      el.bannerAct.style.display = "";
    } else {
      el.bannerAct.style.display = "none";
    }
    el.banner.classList.add("show");
  }
  function hideBanner() { el.banner.classList.remove("show"); }

  /* ---------- 设置 ---------- */
  function openSettings() {
    el.overlay.classList.add("show");
    fetch("/api/status").then(function (r) { return r.json(); }).then(function (s) {
      el.stReady.textContent = s.ready ? "已就绪" : "未配置 API Key";
      el.stReady.className = "v " + (s.ready ? "ok" : "bad");
      el.stProvider.textContent = s.provider || "—";
      el.stModel.textContent = s.model || "—";
      el.stConfig.textContent = s.config_file || "—";
      el.stDesc.textContent = s.error === "CONFIG_MISSING"
        ? "还没找到 config.json：复制 config.example.json 改名为 config.json，填入 API Key 后重启 server.py。"
        : (s.ready ? "" : "把 API Key 填进 config.json，重启 server.py 后生效。");
    }).catch(function () {
      el.stReady.textContent = "无法连接后端";
      el.stReady.className = "v bad";
      el.stProvider.textContent = "—";
      el.stModel.textContent = "—";
      el.stConfig.textContent = "—";
      el.stDesc.textContent = "请确认 server.py 已在电脑上运行。";
    });
  }

  /* ---------- 事件绑定 ---------- */
  el.modeWork.addEventListener("click", function () { setMode("work"); });
  el.modeEmotion.addEventListener("click", function () { setMode("emotion"); });
  el.send.addEventListener("click", function () { send(el.input.value); });
  el.input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send(el.input.value);
      el.input.value = "";
    }
  });
  el.input.addEventListener("input", function () {
    el.input.style.height = "auto";
    el.input.style.height = Math.min(el.input.scrollHeight, 120) + "px";
  });
  document.getElementById("btnSettings").addEventListener("click", openSettings);
  el.overlay.addEventListener("click", function (e) { if (e.target === el.overlay) el.overlay.classList.remove("show"); });
  document.getElementById("btnClear").addEventListener("click", function () {
    state.histories[state.mode] = [];
    saveHist(state.mode);
    renderAll();
    el.overlay.classList.remove("show");
  });
  document.getElementById("chips").addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (!chip) return;
    send(chip.textContent);
  });
  var cards = document.querySelectorAll(".card");
  cards.forEach(function (card) {
    var go = function () {
      var m = card.getAttribute("data-mode");
      setMode(m);
      el.main.scrollTop = 0;
    };
    card.addEventListener("click", go);
    card.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });

  /* ---------- 启动 ---------- */
  setMode("work");
  el.input.focus();
})();
</script>
</body>
</html>
